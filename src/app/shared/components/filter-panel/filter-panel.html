<div class="panel_filtros">
  @if (ver('modalidad')) {
  <fieldset class="grupo_panel_filtros">
    <legend class="leyenda_panel_filtros" [class.oculto]="solo()">Modalidad</legend>
    <div class="fichas_panel_filtros">
      @for (m of modalities; track m.value) {
        <label class="ficha_panel_filtros" [class.is-activa]="selectedModalities().includes(m.value)">
          <input type="checkbox" class="oculto"
            [checked]="selectedModalities().includes(m.value)"
            (change)="toggleModality(m.value)" />
          {{ m.label }}
        </label>
      }
    </div>
  </fieldset>
  }

  @if (ver('tamano')) {
  <fieldset class="grupo_panel_filtros">
    <legend class="leyenda_panel_filtros" [class.oculto]="solo()">Tamaño de la vivienda</legend>
    <div class="fichas_panel_filtros">
      @for (size of sizes; track size.value) {
        <label class="ficha_panel_filtros" [class.is-activa]="selectedSizes().includes(size.value)">
          <input type="checkbox" class="oculto"
            [checked]="selectedSizes().includes(size.value)"
            (change)="toggleSize(size.value)" />
          {{ size.label }}
        </label>
      }
    </div>
  </fieldset>
  }

  @if (ver('precio')) {
  <fieldset class="grupo_panel_filtros">
    <legend class="leyenda_panel_filtros" [class.oculto]="solo()">Tarifa por hora (COP)</legend>
    <div class="rango_panel_filtros">
      <label>
        <span class="oculto">Tarifa mínima</span>
        <input type="number" class="campo" inputmode="numeric" min="0" step="1000" placeholder="Desde"
          [ngModel]="precioMin()" (ngModelChange)="precioMin.set($event)" name="precioMin"
          (blur)="submit()" (keydown.enter)="submit()" />
      </label>
      <span aria-hidden="true">–</span>
      <label>
        <span class="oculto">Tarifa máxima</span>
        <input type="number" class="campo" inputmode="numeric" min="0" step="1000" placeholder="Hasta"
          [ngModel]="precioMax()" (ngModelChange)="precioMax.set($event)" name="precioMax"
          (blur)="submit()" (keydown.enter)="submit()" />
      </label>
    </div>
  </fieldset>
  }

  @if (!solo()) {
    <button type="button" class="limpiar_panel_filtros" (click)="reset()">Quitar filtros</button>
  }
</div>

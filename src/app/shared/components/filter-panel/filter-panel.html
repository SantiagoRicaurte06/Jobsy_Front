<aside class="filter-panel">
  <h3 class="filter-panel__title">Filtros</h3>

  <!-- Tamano de la vivienda -->
  <fieldset class="filter-panel__group">
    <legend class="filter-panel__legend">Tamano</legend>
    @for (size of sizes; track size.value) {
      <label class="form-check">
        <input
          type="checkbox"
          [checked]="selectedSizes().includes(size.value)"
          (change)="toggleSize(size.value)" />
        {{ size.label }}
      </label>
    }
  </fieldset>

  <!-- Modalidad de trabajo -->
  <fieldset class="filter-panel__group">
    <legend class="filter-panel__legend">Modalidad</legend>
    @for (m of modalities; track m.value) {
      <label class="form-check">
        <input
          type="checkbox"
          [checked]="selectedModalities().includes(m.value)"
          (change)="toggleModality(m.value)" />
        {{ m.label }}
      </label>
    }
  </fieldset>

  <!-- Rango de precio por hora -->
  <fieldset class="filter-panel__group">
    <legend class="filter-panel__legend">Precio por hora (COP)</legend>
    <div class="filter-panel__range">
      <input
        type="number"
        class="form-input"
        placeholder="Min"
        [ngModel]="precioMin()"
        (ngModelChange)="precioMin.set($event)"
        name="precioMin" />
      <span aria-hidden="true">&ndash;</span>
      <input
        type="number"
        class="form-input"
        placeholder="Max"
        [ngModel]="precioMax()"
        (ngModelChange)="precioMax.set($event)"
        name="precioMax" />
    </div>
  </fieldset>

  <div class="filter-panel__actions">
    <button type="button" class="btn-secondary btn-block" (click)="submit()">Aplicar filtros</button>
    <button type="button" class="btn-ghost btn-block btn-sm" (click)="reset()">Limpiar</button>
  </div>
</aside>

<div class="ventana">
  <!-- Clic fuera del panel cierra el modal -->
  <div class="fondo_ventana" (click)="cerrar.emit()" aria-hidden="true"></div>

  <div class="panel_ventana" #panel role="dialog" aria-modal="true"
    [attr.aria-labelledby]="title() ? idTitulo : null"
    [attr.aria-label]="title() ? null : 'Ventana'"
    tabindex="-1">
    <header class="encabezado_ventana">
      <div>
        @if (title()) { <h2 class="titulo_ventana" [id]="idTitulo">{{ title() }}</h2> }
        @if (subtitle()) { <p class="subtitulo_ventana">{{ subtitle() }}</p> }
      </div>

      <button type="button" class="cerrar_ventana" (click)="cerrar.emit()" aria-label="Cerrar">
        <jobsy-icon name="x" />
      </button>
    </header>

    <div class="cuerpo_ventana">
      <ng-content />
    </div>
  </div>
</div>

<ol class="pasos">
  @for (step of steps(); track step; let i = $index) {
    <li
      class="elemento_pasos"
      [class.is-done]="i < current()"
      [class.is-current]="i === current()">
      <span class="punto_pasos">
        @if (i < current()) {
          <jobsy-icon name="check" />
        } @else {
          {{ i + 1 }}
        }
      </span>
      <span class="etiqueta_pasos">{{ step }}</span>
    </li>
  }
</ol>

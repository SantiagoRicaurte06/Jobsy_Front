<form class="barra_busqueda" (ngSubmit)="submit()">
  <div class="campo_barra_busqueda">
    <span class="icono_barra_busqueda" aria-hidden="true">&#128269;</span>
    <input
      type="search"
      class="entrada_barra_busqueda"
      [placeholder]="placeholder()"
      [ngModel]="termino()"
      (ngModelChange)="termino.set($event)"
      name="termino"
      aria-label="Termino de busqueda" />
  </div>

  @if (showCity()) {
    <div class="campo_barra_busqueda campo_barra_busqueda_ciudad">
      <span class="icono_barra_busqueda" aria-hidden="true">&#128205;</span>
      <input
        type="text"
        class="entrada_barra_busqueda"
        placeholder="Yopal, Casanare"
        [ngModel]="ciudad()"
        (ngModelChange)="ciudad.set($event)"
        name="ciudad"
        aria-label="Ciudad" />
    </div>
  }

  <button type="submit" class="boton_secundario">Buscar</button>
</form>

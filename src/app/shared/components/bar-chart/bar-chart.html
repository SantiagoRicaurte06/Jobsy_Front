<figure class="grafico">
  @if (unit()) {
    <figcaption class="unidad_grafico">{{ unit() }}</figcaption>
  }

  <ul class="area_grafico">
    @for (bar of bars(); track bar.label) {
      <li class="columna_grafico">
        <div
          class="barra_grafico"
          [class.is-highlight]="bar.destacado"
          [class.is-projected]="bar.proyectado"
          [style.height.%]="bar.height"
          [attr.title]="bar.label + ': ' + bar.value"
          aria-hidden="true">
        </div>
        <span class="etiqueta_grafico" [class.is-highlight]="bar.destacado">
          {{ bar.label }}<span class="oculto">: {{ bar.value }} {{ unit() }}</span>
        </span>
      </li>
    }
  </ul>

  @if (serie() || hayDestacado() || hayProyectado()) {
    <ul class="leyenda_grafico" aria-hidden="true">
      @if (serie()) { <li><span class="clave_grafico"></span> {{ serie() }}</li> }
      @if (hayDestacado()) { <li><span class="clave_grafico clave_grafico_destacado"></span> {{ etiquetaDestacado() }}</li> }
      @if (hayProyectado()) { <li><span class="clave_grafico clave_grafico_proyectado"></span> Proyectado</li> }
    </ul>
  }
</figure>

<div class="estrellas">
  <span class="iconos_estrellas" [attr.aria-label]="'Calificacion ' + value() + ' de 5'">
    @for (filled of stars(); track $index) {
      <span class="estrella" [class.is-filled]="filled">&#9733;</span>
    }
  </span>

  @if (showValue()) {
    <strong class="valor_estrellas">{{ value().toFixed(1) }}</strong>
  }

  @if (reviews() !== null) {
    <span class="resenas_estrellas">({{ reviews() }})</span>
  }
</div>

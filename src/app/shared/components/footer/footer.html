<footer class="pie">
  <div class="interior_pie">
    <div class="cierre_pie">
      <jobsy-logo variant="claro" size="medio" />
      <p class="lema_pie">Trabajo de hogar con condiciones claras para las dos partes.</p>
      <p class="zona_pie"><jobsy-icon name="map-pin" /> Hoy en Yopal y Casanare.</p>
    </div>

    @for (col of columns; track col.title) {
      <nav class="columna_pie" [attr.aria-label]="col.title">
        <h2 class="titulo_columna_pie">{{ col.title }}</h2>
        <ul>
          @for (link of col.links; track link.label) {
            <li><a [routerLink]="link.path">{{ link.label }}</a></li>
          }
        </ul>
      </nav>
    }
  </div>

  <div class="inferior_pie">
    <p>&copy; {{ year }} Jobsy</p>
    <nav aria-label="Legal">
      <a routerLink="/legal/terminos">Términos</a>
      <a routerLink="/legal/privacidad">Privacidad</a>
      <a routerLink="/legal/privacidad" fragment="cookies">Cookies</a>
      <a href="/fotos/CREDITOS.md">Créditos de las fotos</a>
    </nav>
  </div>
</footer>

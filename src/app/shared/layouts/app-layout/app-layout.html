<div class="marco_privado">
  <button type="button" class="saltar_contenido" (click)="principal.focus()">Saltar al contenido</button>
  <jobsy-header />

  <div class="cuerpo_marco_privado">
    <div class="interior_marco_privado">
      <aside class="lateral_marco_privado">
        <nav class="menu_marco_privado" aria-label="Mi cuenta">
          @for (item of menu(); track item.path) {
            <a [routerLink]="item.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">
              <jobsy-icon [name]="item.icon" />
              {{ item.label }}
            </a>
          }
        </nav>
      </aside>

      <main class="principal_marco_privado" #principal tabindex="-1" id="contenido">
        @if (sinPermiso()) {
          <p class="aviso_permiso_marco_privado" role="alert">
            <jobsy-icon name="info" />
            <span>Esa sección no está disponible para tu tipo de cuenta. Te trajimos a tu panel.</span>
            <button type="button" (click)="cerrarAviso()" aria-label="Cerrar aviso"><jobsy-icon name="x" /></button>
          </p>
        }
        <router-outlet />
      </main>
    </div>
  </div>

  <jobsy-footer />
</div>

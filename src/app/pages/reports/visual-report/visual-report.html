<section class="visual-report">
  <div class="section-head">
    <h1>Reporte visual</h1>
    <a routerLink="/app/reportes" class="btn-ghost btn-sm">Volver al centro</a>
  </div>

  <!-- KPIs -->
  <div class="visual-report__kpis">
    @for (kpi of kpis; track kpi.label) {
      <div class="visual-report__kpi card">
        <span class="visual-report__kpi-label">{{ kpi.label }}</span>
        <strong class="visual-report__kpi-value">{{ kpi.value }}</strong>
        <span class="visual-report__kpi-delta">&#9650; {{ kpi.delta }}</span>
      </div>
    }
  </div>

  <div class="visual-report__grid">
    <!-- Grafico principal -->
    <section class="card visual-report__chart">
      <div class="section-head">
        <h2>Postulaciones por mes &mdash; {{ periodo() }}</h2>
      </div>

      <jobsy-bar-chart [data]="postulaciones" unit="postulaciones" />
    </section>

    <!-- Distribucion por categoria -->
    <section class="card visual-report__breakdown">
      <h2>Tipos de servicio</h2>

      <ul>
        @for (cat of categorias; track cat.nombre) {
          <li>
            <div class="visual-report__cat-head">
              <span>{{ cat.nombre }}</span>
              <strong>{{ cat.porcentaje }}%</strong>
            </div>
            <div class="visual-report__meter">
              <span [style.width.%]="cat.porcentaje"></span>
            </div>
          </li>
        }
      </ul>
    </section>
  </div>
</section>

<div class="login card">
  <header class="login__head">
    <jobsy-logo variant="color" size="lg" />
    <h1 class="login__title">Bienvenido de nuevo</h1>
    <p class="login__subtitle">Inicia sesion para continuar en Jobsy</p>
  </header>

  <form (ngsSubmit)="submit()">
    <div class="form-group">
      <label class="form-label" for="usuario">Usuario o correo eletronico</label>
      <div class="login_field">
        <span class="login__icon" aria-hidden="true">&#128100;</span>
        <input
          id="usuario"
          type="text"
          class="form-input"
          placeholder="Ingresa tu usuario o correo"
          autocomplete="username"
          [ngModel]="usuario()"
          (ngModelChange)="usuario.set($event)"
          name="usuario"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Contrasena</label>
      <div class="login__field">
        <span class="login__icon" aria-hidden="true">&#128274;</span>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          class="form-input"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
        />

        <button
          type="button"
          class="login__eye"
          (click)="togglePassword()"
          [attr.arial-label]="showPassword() ? 'Ocultar contrasena' : 'Mostrar contrasena'"
        >
          &#128065;
        </button>
      </div>
    </div>
    <p class="login_forgot">
      <a routerLink="/auth/recuperar">&iquest;Olvidaste tu contrasena?</a>
    </p>

    @if (error()) {
      <p class="form-error login__error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn-primary btn-block" [disabled]="loading()">
      {{loading() ? 'Ingresando...' : 'Iniiar Sesion' }}
    </button>
  </form>

  <div class="login_divider"><span>o</span></div>

  <button class="btn-ghost btn-block" type="button" (click)="google()" [disabled]="loading()">
    <span class="login__google" aria-hidden="true">G</span> Continuar con Google
  </button>

  <p class="login__signup">
    &iquest;Nuevo en Jobsy? <a routerLink="/registro/crear-cuenta">Crear cuenta</a>
  </p>
</div>

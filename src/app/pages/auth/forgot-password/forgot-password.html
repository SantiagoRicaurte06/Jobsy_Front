<div class="forgot-password card">
  <header class="forgot-password__head">
    <jobsy-logo variant="color" size="chico" />
    <h1 class="forgot-password__title">Restablecer contrasena</h1>
    <p class="forgot-password__subtitle">
      Escribe tu correo y te enviaremos un enlace para crear una nueva contrasena.
    </p>
  </header>

  <form (ngSubmit)="submit()">
    <div class="form-group">
      <label class="form-label" for="email">Correo electronico</label>
      <input
        id="email"
        type="email"
        class="form-input"
        placeholder="tucorreo@ejemplo.com"
        autocomplete="email"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email" />
    </div>

    <button type="submit" class="btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Enviando...' : 'Enviar enlace' }}
    </button>
  </form>

  <p class="forgot-password__back">
    <a routerLink="/auth/login">&#8592; Volver a iniciar sesion</a>
  </p>
</div>

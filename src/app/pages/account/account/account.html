<section class="account">
  <div class="section-head">
    <h1>Mi cuenta</h1>
  </div>

  <nav class="account__tabs">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" routerLinkActive="is-active">{{ tab.label }}</a>
    }
  </nav>

  <div class="account__panel">
    <router-outlet />
  </div>
</section>

<div class="cuenta_creada tarjeta">
  <header class="campo_cuenta_creada">
    <span class="check_cuenta_creada" aria-hidden="true"><jobsy-icon name="check" /></span>
    <span class="kicker_cuenta_creada">Registro completo</span>
    <h1 class="titulo_cuenta_creada">&iexcl;Cuenta creada con éxito!</h1>
  </header>

  <div class="cuerpo_cuenta_creada">
  <p class="texto_cuenta_creada">
    Ya eres parte de Jobsy. Te enviamos un correo de confirmación para verificar tu cuenta.
  </p>

  <p class="etiqueta_pasos_cuenta_creada">Lo que sigue</p>
  <ul class="pasos_cuenta_creada">
    @for (step of nextSteps; track step.title) {
      <li>
        <a [routerLink]="step.path">
          <span aria-hidden="true"><jobsy-icon [name]="step.icon" /></span>
          {{ step.title }}
          <span class="flecha_cuenta_creada" aria-hidden="true"><jobsy-icon name="arrow-right" /></span>
        </a>
      </li>
    }
  </ul>

  <a routerLink="/auth/login" class="boton_principal boton_ancho">Iniciar sesión</a>
  </div>
</div>

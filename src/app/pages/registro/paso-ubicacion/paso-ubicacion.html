
<div class="paso-ubicacion tarjeta">
  <jobsy-step-progress [steps]="steps()" [current]="steps().length - 1" />

  <h1 class="paso-ubicacion__title">Ubicación y foto</h1>
  <p class="paso-ubicacion__subtitle">Último paso. Así los empleadores cercanos podrán encontrarte.</p>

  <form (ngSubmit)="finish()">
    <!--FOTO DE PERFIL-->
    <div class="grupo_campo paso-ubicacion__photo-group">
      @if (fotoPreview()) {
        <img [src]="fotoPreview()" alt="Vista previa de tu foto" />
      } @else {
        <span aria-hidden="true">&#128247;</span>
      }
    </div>

    <div>
      <label class="boton_simple boton_chico" for="foto">Subir foto</label>
      <input id="foto" type="file" accept="image/*" class="oculto" (change)="onlife($event)" />
      <p class="ayuda">JPG o PNG, máximo 2 MB.</p>
    </div>

    <div class="grupo_campo">
      <label class="etiqueta" for="ciudad">Ciudad</label>
      <select id="ciudad" class="lista"
        [ngModel]="ciudad()" (ngModelChange)="ciudad.set($event)" name="ciudad">
        @for (c of Ciudades; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>

    <div class="grupo_campo">
      <label class="etiqueta" for="barrio">Barrio o zona</label>
      <input id="barrio" type="text" class="campo" placeholder="Ej: El Alcaravan" maxlength="100"
        [ngModel]="barrio()" (ngModelChange)="barrio.set($event)" name="barrio" />
    </div>

    <!-- Radio De Trabajo: solo aplica al rol empleado, el empleador no se desplaza -->
    @if (rol() !== 'empleador') {
     <div class="grupo_campo">
      <label class="etiqueta" for="distancia">
        Distancia máxima de trabajo: <strong>{{ distanciaKm() }} km</strong>
        </label>
        <input id="distancia" type="range" min="1" max="50" class="paso-ubicacion__range"
        [ngModel]="distanciaKm()" (ngModelChange)="distanciaKm.set(+$event)" name="distancia" />
        <div class="paso-ubicacion__range-labels">
          <span>1 km</span>
          <span>50 km</span>
        </div>
     </div>
    }

     @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
     }

     <div class="paso-ubicacion__actions">
      <button type="button" class="boton_simple" (click)="back()">Atrás</button>
      <button type="submit" class="boton_principal" [disabled]="cargando()">
        {{ cargando() ? 'Creando cuenta...' : 'Finalizar registro'}}
      </button>
     </div>
  </form>
</div>


<div class="crear_cuenta tarjeta">
  <header class="cabecera_crear_cuenta">
    <span class="kicker_crear_cuenta">Registro</span>
    <h1>Crear cuenta</h1>
    <p>Empieza gratis en Jobsy. Luego eliges si buscas trabajo o buscas a alguien.</p>
  </header>

  <form (ngSubmit)="submit()">
    <div class="fila_crear_cuenta">
      <div class="grupo_campo">
        <label class="etiqueta" for="nombre">Nombre</label>
        <input id="nombre" type="text" class="campo" placeholder="Santiago" maxlength="60" autocomplete="given-name"
          [ngModel]="nombre()" (ngModelChange)="nombre.set($event)" name="nombre" />
      </div>

      <div class="grupo_campo">
        <label class="etiqueta" for="apellido">Apellido</label>
        <input id="apellido" type="text" class="campo" placeholder="Ricaurte" maxlength="60" autocomplete="family-name"
          [ngModel]="apellido()" (ngModelChange)="apellido.set($event)" name="apellido" />
      </div>
    </div>

    <div class="grupo_campo">
      <label class="etiqueta" for="email">Correo electrónico</label>
      <input id="email" type="email" class="campo" placeholder="tucorreo@ejemplo.com"
        autocomplete="email" maxlength="150"
        [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" />
    </div>

    <div class="grupo_campo">
      <label class="etiqueta" for="password">Contraseña</label>
      <input id="password" type="password" class="campo" placeholder="Mínimo 8 caracteres"
        autocomplete="new-password"
        [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" />
      <p class="ayuda">Usa al menos 8 caracteres, con letras y números.</p>
    </div>

    <div class="grupo_campo">
      <label class="etiqueta" for="confirm">Confirmar contraseña</label>
      <input id="confirm" type="password" class="campo" placeholder="Repite tu contraseña"
        autocomplete="new-password"
        [ngModel]="confirm()" (ngModelChange)="confirm.set($event)" name="confirm" />
    </div>

    <label class="casilla terminos_crear_cuenta">
      <input type="checkbox" [ngModel]="acepta()" (ngModelChange)="acepta.set($event)" name="acepta" />
      Acepto los <a routerLink="/legal/terminos" target="_blank">términos y condiciones</a> y la
      <a routerLink="/legal/privacidad" target="_blank">política de privacidad</a>.
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="boton_principal boton_ancho">Continuar</button>
  </form>

  <p class="acceso_crear_cuenta">
    &iquest;Ya tienes cuenta? <a routerLink="/auth/login">Iniciar sesión</a>
  </p>
</div>

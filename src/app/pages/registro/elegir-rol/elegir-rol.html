
<div class="elegir_rol tarjeta">
  <header class="encabezado_elegir_rol">
    <jobsy-logo variant="color" size="grande" />
    <h1 class="titulo_elegir_rol">&iquest;Como Quieres Usar Jobsy?</h1>
    <p class="subtitulo_elegir_rol">Elige Tu Rol. Podrás Cambiarlo Más Adelante</p>
  </header>

  <div class="opciones_elegir_rol">
    @for (role of roles; track role.value) {
      <button
        type="button"
        class="opcion_elegir_rol"
        [class.is-selected]="selected() === role.value"
        [attr.aria-pressed]="selected() === role.value"
        (click)="select(role.value)">
      <span class="icono_elegir_rol" aria-hidden="true"><jobsy-icon [name]="role.icon" /></span>
      <strong class="titulo_opcion_elegir_rol">{{ role.title }}</strong>
      <span class="texto_opcion_elegir_rol">{{ role.text }}</span>

      <ul class="beneficios_elegir_rol">
        @for (perk of role.perks; track perk) {
          <li><jobsy-icon name="check" /> {{ perk }}</li>
        }
      </ul>
      
    </button>

    }
  </div>

  <button type="button" class="boton_principal boton_ancho" [disabled]="!selected()" (click)="continue()">
    Continuar
  </button>
</div>

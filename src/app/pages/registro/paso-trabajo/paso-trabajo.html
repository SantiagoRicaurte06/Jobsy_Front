
<div class="step-work card">
  <jobsy-step-progress [steps]="steps" [current]="1" />

  <h1 class="step-work__title">Modalidad De Trabajo</h1>
  <p class="step-work__subtitle">Cuentanos Como Prefieres Trabajar. Puedes Elejir Varias</p>

  <form (ngSubmit)="next()">

    <!-- MODALIDADES -->
    <div class="form-group">
      <label class="form-label">Modalidades Disponibles</label>
      <div class="step-work__grid">
        @for (op of opcionesModalidad; track op.value) {
          <button
            type="button"
            class="step-work__option"
            [class.is-selected]="modalidades().includes(op.value)"
            [attr.aria-pressed]="modalidades().includes(op.value)"
            (click)="toggleModalidad(op.value)">
            <span class="step-work__icon" aria-hidden="true">{{ op.icon }}</span>
            <strong>{{ op.label }}</strong>
            <span class="step-work__option-text">{{ op.text }}</span>
          </button>
        }
      </div>
    </div>


    <!-- ESPECIALIDADES -->
    <div class="form-group">
      <label class="form-label">Especialidades</label>
      <ul class="step-work__chips">
        @for (e of opcionesEspecialidad; track e) {
          <li>
            <button
              type="button"
              class="step-work__chip"
              [class.is-selected]="especialidades().includes(e)"
              [attr.aria-pressed]="especialidades().includes(e)"
              (click)="toggleEspecialidades(e)">
              {{ e }}
            </button>
          </li>
        }
      </ul>
    </div>

    <!--EXPERIENCIA-->

    <div class="form-group">
      <label class="form-label" for="experiencia">Cuentanos Tu Experiencia</label>
      <textarea id="experiencia" class="form-textarea"
      placeholder="Ej: 6 Anos De Experiencia En Hogares De Yopal, Con Enfasis En Limpieza Profunda Y Cocina"
      [ngModel]="experiencia()" (ngModelChange)="experiencia.set($event)" name="experiencia"></textarea>
    <p class="form-hint">Este Texto Aparecera En Tu Perfil Publico.</p>
    </div>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <div class="step-work__actions">
      <button type="button" class="btn-ghost" (click)="back()">Atras</button>
      <button type="submit" class="btn-primary">Siguiente</button>
    </div>
  </form>
</div>

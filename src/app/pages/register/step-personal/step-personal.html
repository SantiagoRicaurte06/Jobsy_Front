<div class="step-personal card">
  <jobsy-step-progress [steps]="steps" [current]="0" />

  <h1 class="step-personal__title">Datos personales</h1>
  <p class="step-personal__subtitle">Esta Informacion Nos Ayuda A Verificar Tu Identidad.</p>

  <form (ngSubmit)="next()">
    <div class="form-group">
      <label class="form-label" for="nacionalidad">Nacionalidad</label>
      <select id="nacionalidad" class="form-select"
        [ngModel]="nacionalidad()" (ngModelChange)="nacionalidad.set($event)" name="nacionalidad">
        @for (n of nacionalidades; track n) {
          <option [value]="n">{{ n }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Genero</label>
      <div class="step-personal__options">
        @for (g of generos; track g) {
          <label class="step-personal__radio" [class.is-selected]="genero() === g">
            <input type="radio" name="genero" [value]="g"
              [ngModel]="genero()" (ngModelChange)="genero.set($event)" />
            {{ g }}
          </label>
        }
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="fecha">Fecha de nacimiento</label>
      <input id="fecha" type="date" class="form-input"
        [ngModel]="fechaNacimiento()" (ngModelChange)="fechaNacimiento.set($event)" name="fecha" />
    </div>

    <div class="form-group">
      <label class="form-label" for="documento">Numero de documento</label>
      <input id="documento" type="text" class="form-input" placeholder="1.234.567.890"
        [ngModel]="documento()" (ngModelChange)="documento.set($event)" name="documento" />
      <p class="form-hint">Lo Usamos Solo Para Verificar Tu Perfil. Nunca Se Muestra Publicamente.</p>
    </div>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <div class="step-personal__actions">
      <button type="button" class="btn-ghost" (click)="back()">Atras</button>
      <button type="submit" class="btn-primary">Siguiente</button>
    </div>
  </form>
</div>

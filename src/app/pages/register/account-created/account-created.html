<div class="account-created card">
  <jobsy-logo variant="color" size="lg" />

  <span class="account-created__check" aria-hidden="true">&#10004;</span>

  <h1 class="account-created__title">&iexcl;Cuenta creada con exito!</h1>
  <p class="account-created__text">
    Ya eres parte de Jobsy. Te enviamos un correo de confirmacion para verificar tu cuenta.
  </p>

  <ul class="account-created__steps">
    @for (step of nextSteps; track step.title) {
      <li>
        <a [routerLink]="step.path">
          <span aria-hidden="true">{{ step.icon }}</span>
          {{ step.title }}
          <span class="account-created__arrow" aria-hidden="true">&#8594;</span>
        </a>
      </li>
    }
  </ul>

  <a routerLink="/auth/login" class="btn-primary btn-block">Iniciar sesion</a>
</div>

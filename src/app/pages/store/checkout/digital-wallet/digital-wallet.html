<section class="wallet">
  <h2 class="wallet__title">Billetera digital</h2>
  <p class="wallet__subtitle">Recibiras una notificacion en tu app para aprobar el pago.</p>

  <p class="wallet__demo">&#9888; Modo demostracion: no se envia ninguna solicitud real.</p>

  <form (ngSubmit)="pagar()">
    <div class="form-group">
      <label class="form-label">Elige tu billetera</label>
      <div class="wallet__options">
        @for (b of billeteras; track b.value) {
          <button type="button" class="wallet__option"
            [class.is-selected]="billetera() === b.value"
            (click)="billetera.set(b.value)">
            <span aria-hidden="true">{{ b.icon }}</span>
            {{ b.label }}
          </button>
        }
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="telefono">Numero de celular</label>
      <input id="telefono" type="tel" class="form-input" placeholder="300 123 4567"
        inputmode="tel"
        [ngModel]="telefono()" (ngModelChange)="telefono.set($event)" name="telefono" />
      <p class="form-hint">Debe ser el numero asociado a tu billetera.</p>
    </div>

    <button type="submit" class="btn-primary btn-block" [disabled]="procesando()">
      {{ procesando() ? 'Esperando aprobacion...' : 'Enviar solicitud de pago' }}
    </button>
  </form>
</section>

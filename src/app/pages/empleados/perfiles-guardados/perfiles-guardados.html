<section class="guardados">
  <header class="guardados__head">
    <div>
      <h1>Perfiles guardados</h1>
      <p class="guardados__sub">Los empleados que guardaste para contactarlos despues.</p>
    </div>
    <a routerLink="/empleados" class="boton_simple boton_chico"><jobsy-icon name="search" /> Buscar empleados</a>
  </header>

  @if (error()) {
    <p class="pildora_error" role="alert">{{ error() }}</p>
  }

  @if (cargando()) {
    <jobsy-loading-spinner />
  } @else if (perfiles().length === 0) {
    <jobsy-empty-state icon="heart" title="Aun no guardas perfiles"
      message="En el perfil de un empleado pulsa «Guardar perfil» y aparecera aqui." />
    <div class="guardados__centro"><a routerLink="/empleados" class="boton_principal">Explorar empleados</a></div>
  } @else {
    <div class="guardados__rejilla">
      @for (e of perfiles(); track e.id) {
        <div class="guardados__item">
          <jobsy-employee-card [employee]="e" (solicitar)="solicitar($event)" />
          <button type="button" class="boton_simple boton_chico" [disabled]="quitando() === e.id" (click)="quitar(e)">
            <jobsy-icon name="x" /> {{ quitando() === e.id ? 'Quitando...' : 'Quitar de guardados' }}
          </button>
        </div>
      }
    </div>
  }
</section>

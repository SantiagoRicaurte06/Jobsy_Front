  <section class="editar_perfil">
  @if (loading()) {
    <jobsy-loading-spinner />
  } @else {
    <div class="encabezado_seccion">
      <h1>Editar perfil</h1>
      <a routerLink="/app/perfil" class="boton_simple boton_chico">Cancelar</a>
    </div>

    @if (guardado()) {
      <p class="guardado_editar_perfil" role="status">&#10004; Cambios guardados correctamente.</p>
    }

    <form class="tarjeta formulario_editar_perfil" (ngSubmit)="submit()">
      <h2 class="leyenda_editar_perfil">Datos personales</h2>

      <div class="fila_editar_perfil">
        <div class="grupo_campo">
          <label class="etiqueta" for="nombre">Nombre</label>
          <input id="nombre" type="text" class="campo"
            [ngModel]="nombre()" (ngModelChange)="nombre.set($event)" name="nombre" />
        </div>

        <div class="grupo_campo">
          <label class="etiqueta" for="apellido">Apellido</label>
          <input id="apellido" type="text" class="campo"
            [ngModel]="apellido()" (ngModelChange)="apellido.set($event)" name="apellido" />
        </div>
      </div>

      <div class="grupo_campo">
        <label class="etiqueta" for="email">Correo electronico</label>
        <input id="email" type="email" class="campo" [value]="email()" disabled />
        <p class="ayuda">El correo no se puede cambiar desde aqui.</p>
      </div>

      <div class="fila_editar_perfil">
        <div class="grupo_campo">
          <label class="etiqueta" for="telefono">Telefono</label>
          <input id="telefono" type="tel" class="campo" placeholder="300 123 4567"
            [ngModel]="telefono()" (ngModelChange)="telefono.set($event)" name="telefono" />
        </div>

        <div class="grupo_campo">
          <label class="etiqueta" for="ciudad">Ciudad</label>
          <select id="ciudad" class="lista"
            [ngModel]="ciudad()" (ngModelChange)="ciudad.set($event)" name="ciudad">
            @for (c of ciudades; track c) { <option [value]="c">{{ c }}</option> }
          </select>
        </div>
      </div>

      <h2 class="leyenda_editar_perfil">Perfil publico</h2>

      <div class="grupo_campo">
        <label class="etiqueta" for="descripcion">Descripcion</label>
        <textarea id="descripcion" class="area_texto"
          placeholder="Cuenta brevemente quien eres y como trabajas."
          [ngModel]="descripcion()" (ngModelChange)="descripcion.set($event)" name="descripcion"></textarea>
      </div>

      <div class="grupo_campo">
        <label class="etiqueta">Especialidades</label>
        <ul class="fichas_editar_perfil">
          @for (e of opcionesEspecialidad; track e) {
            <li>
              <button type="button" class="ficha_editar_perfil"
                [class.is-selected]="especialidades().includes(e)"
                (click)="toggleEspecialidad(e)">
                {{ e }}
              </button>
            </li>
          }
        </ul>
      </div>

      <footer class="acciones_editar_perfil">
        <a routerLink="/app/perfil" class="boton_simple">Cancelar</a>
        <button type="submit" class="boton_principal" [disabled]="saving()">
          {{ saving() ? 'Guardando...' : 'Guardar cambios' }}
        </button>
      </footer>
    </form>
  }
</section>

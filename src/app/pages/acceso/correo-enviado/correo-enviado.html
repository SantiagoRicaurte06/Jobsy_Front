<div class="correo-enviado tarjeta">
  <span class="correo-enviado__icon" aria-hidden="true"><jobsy-icon name="mail" /></span>

  <span class="kicker">Recuperar acceso</span>
  <h1 class="correo-enviado__title">Correo enviado</h1>

  <p class="correo-enviado__text">
    Enviamos un enlace de recuperación a <strong>{{ email }}</strong>.
    Revisa tu bandeja de entrada y la carpeta de spam.
  </p>

  <a routerLink="/auth/login" class="boton_principal boton_ancho">Volver a iniciar sesión</a>

  <p class="correo-enviado__resend">
    &iquest;No te llegó? <a routerLink="/auth/recuperar">Enviar de nuevo</a>
  </p>
</div>

<div class="ingreso-exitoso tarjeta">
  <jobsy-logo variant="color" size="grande" />

  <span class="ingreso-exitoso__check" aria-hidden="true"><jobsy-icon name="check" /></span>

  <h1 class="ingreso-exitoso__title">&iexcl;Bienvenido, {{ user()?.nombre }}!</h1>
  <p class="ingreso-exitoso__text">Iniciaste sesion correctamente en Jobsy.</p>

  <button type="button" class="boton_principal boton_ancho" (click)="go()">
    Ir a mi inicio
  </button>

  <p class="ingreso-exitoso__timer">
    Te redirigiremos en {{ seconds() }}s...
  </p>

  <a routerLink="/" class="ingreso-exitoso__home">Ir al inicio publico</a>
</div>

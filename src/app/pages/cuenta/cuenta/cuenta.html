<section class="cuenta">
  <header class="cabecera_cuenta">
    <span class="kicker_cuenta">Tu cuenta</span>
    <h1>Mi cuenta</h1>
  </header>

  <nav class="pestanas_cuenta" aria-label="Secciones de la cuenta">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" routerLinkActive="is-active">{{ tab.label }}</a>
    }
  </nav>

  <div class="panel_cuenta">
    <router-outlet />
  </div>
</section>
